<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salto Final</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
  { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="game"></canvas>

<!-- Menú principal -->
<div id="menu" class="screen">
  <div class="panel">
    <h1>SALTO FINAL</h1>
    <p class="sub">Saltá del bus, sobreviví a la tormenta, quedá último en pie.</p>
    <label>Tu nombre <input id="name" maxlength="16" placeholder="Jugador"></label>
    <button id="btnCreate" class="primary">Crear sala</button>
    <button id="btnBots" class="btn-bots" type="button">🤖 Jugar con bots<small id="botsResumenMenu"></small></button>
    <div class="row">
      <input id="code" maxlength="5" placeholder="CÓDIGO" autocomplete="off">
      <button id="btnJoin">Unirse</button>
    </div>
    <p id="menuError" class="error"></p>
    <button id="btnConfigMenu" class="btn-config" type="button">⚙ Configuración</button>
  </div>
</div>

<!-- Sala de espera -->
<div id="lobby" class="screen hidden">
  <div class="panel">
    <p class="sub">Código de la sala</p>
    <div id="roomCode" class="code" title="Clic para copiar"></div>
    <p class="hint">Pasale este código a tus amigos para que se unan.</p>
    <ul id="playerList"></ul>
    <!-- bots: el anfitrión elige hasta cuántos jugadores completan y la dificultad; los demás ven lo elegido -->
    <div id="botsSala" class="bots-sala">
      <div class="bots-titulo">🤖 Bots</div>
      <div id="botsElegir" class="bots-elegir">
        <label>Completar la sala hasta <select id="botsTotal"></select></label>
        <label>Dificultad <select id="botsDif"></select></label>
      </div>
      <p id="botsResumen" class="hint"></p>
    </div>
    <button id="btnStart" class="primary">Empezar partida</button>
    <p id="waitHost" class="hint">Esperando a que el anfitrión empiece…</p>
    <button id="btnConfigSala" class="btn-config" type="button">⚙ Configuración</button>
  </div>
</div>

<!-- HUD -->
<!-- aviso de servidor desactualizado (después de un git pull hay que reiniciarlo) -->
<div id="avisoServidor" class="hidden"></div>
<div id="hud" class="hidden">
  <div id="scope" class="hidden"></div>
  <div id="crosshair" class="ch-nada"><i class="dot"></i><i class="ln t"></i><i class="ln b"></i><i class="ln l"></i><i class="ln r"></i><i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="c c4"></i><i class="ring"></i></div>
  <div id="hitmarker"></div>
  <div id="dmgnums"></div>
  <div id="center-msg"></div>
  <div id="topbar">
    <span id="alive">👤 0</span>
    <span id="kills">💀 0</span>
    <span id="stormInfo"></span>
    <span id="fps" class="hidden"></span>
  </div>
  <canvas id="minimap" width="200" height="200"></canvas>
  <div id="killfeed"></div>
  <div id="prompt" class="hidden"></div>
  <div id="usebar" class="hidden"><div id="usefill"></div><span id="usetext"></span></div>
  <div id="pickupFeed"></div>
  <div id="mats">
    <div class="mat" data-m="madera"><i></i><span>0</span></div>
    <div class="mat" data-m="piedra"><i></i><span>0</span></div>
    <div class="mat" data-m="metal"><i></i><span>0</span></div>
  </div>
  <div id="bottom">
    <div id="bars">
      <div id="shieldbar" class="bar"><div id="shieldfill"></div><span id="shieldtext">0</span></div>
      <div id="hpbar" class="bar"><div id="hpfill"></div><span id="hptext">100</span></div>
    </div>
    <!-- inventario: arriba las piezas de construcción con su tecla, abajo los slots -->
    <div id="inventario">
      <div id="buildhint" class="hidden"></div>
      <div id="buildbar"></div>
      <div id="slots"></div>
      <div id="itemMano"></div>
    </div>
  </div>
  <!-- en el auto: velocidad, vida del auto, turbo y sus teclas (manejar.js) -->
  <div id="autohud" class="hidden">
    <div id="autohint"></div>
    <div class="autopanel">
      <div class="vel"><b id="autovel">0</b><span>km/h</span></div>
      <div class="barras">
        <div class="ab vida"><i id="autovida"></i><span>Auto</span></div>
        <div class="ab turbo"><i id="autoturbo"></i><span>Turbo</span></div>
      </div>
    </div>
  </div>
  <div id="structhp" class="hidden"></div>
  <div id="chatlog"></div>
  <input id="chatInput" class="hidden" maxlength="120" placeholder="Escribí y apretá Enter">
  <div id="damage"></div>
  <div id="clickToPlay" class="hidden">Hacé clic para jugar<button id="btnPausaConfig" type="button">⚙ Configuración <small>Esc</small></button></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
